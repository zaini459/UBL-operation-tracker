<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UBL Operations & Compliance Tracker</title>
    <style>
        /* Corporate Color Architecture */
        :root {
            --ubl-blue: #003366;
            --ubl-gold: #FFCC00;
            --dark-text: #2c3e50;
            --light-bg: #f8f9fa;
            --white: #ffffff;
            --status-pending: #ffc107;
            --status-hold: #dc3545;
            --status-approved: #28a745;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            background-color: var(--light-bg);
            color: var(--dark-text);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: var(--ubl-blue);
            color: var(--white);
            padding: 1.2rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 4px solid var(--ubl-gold);
        }

        header h1 {
            font-size: 1.5rem;
        }

        .container {
            max-width: 1300px;
            margin: 2rem auto;
            padding: 0 1.5rem;
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 2rem;
            flex: 1;
        }

        @media (max-width: 992px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background-color: var(--white);
            border-radius: 8px;
            padding: 1.5rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border-top: 3px solid var(--ubl-blue);
            height: fit-content;
        }

        .card h3 {
            color: var(--ubl-blue);
            margin-bottom: 1.2rem;
            font-size: 1.2rem;
            border-bottom: 1px solid #eee;
            padding-bottom: 0.5rem;
        }

        /* Form Styling */
        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.4rem;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .form-control {
            width: 100%;
            padding: 0.6rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 0.95rem;
        }

        .checkbox-group {
            background: #f1f3f5;
            padding: 0.8rem;
            border-radius: 4px;
            margin-top: 0.5rem;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            margin-bottom: 0.5rem;
            font-size: 0.85rem;
        }

        .checkbox-item input {
            margin-right: 0.5rem;
        }

        .btn-submit {
            width: 100%;
            background-color: var(--ubl-blue);
            color: var(--white);
            border: none;
            padding: 0.75rem;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-submit:hover {
            background-color: #002244;
        }

        /* Table Dashboard Layout */
        .table-responsive {
            background-color: var(--white);
            border-radius: 8px;
            padding: 1.5rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.9rem;
        }

        th {
            background-color: #eef2f7;
            color: var(--ubl-blue);
            padding: 0.8rem;
            font-weight: bold;
            border-bottom: 2px solid #cbd5e1;
        }

        td {
            padding: 0.8rem;
            border-bottom: 1px solid #e2e8f0;
            vertical-align: middle;
        }

        /* Dynamic Status Badges */
        .status-badge {
            display: inline-block;
            padding: 0.25rem 0.6rem;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
            text-align: center;
        }

        .badge-pending { background-color: #fff3cd; color: #856404; }
        .badge-hold { background-color: #f8d7da; color: #721c24; }
        .badge-approved { background-color: #d4edda; color: #155724; }

        .btn-action {
            background: none;
            border: 1px solid #ccc;
            padding: 0.2rem 0.5rem;
            border-radius: 3px;
            cursor: pointer;
            font-size: 0.8rem;
            margin-right: 2px;
        }

        .btn-action:hover {
            background-color: #f1f3f5;
        }

        footer {
            background-color: var(--ubl-blue);
            color: #b0c4de;
            text-align: center;
            padding: 1rem;
            font-size: 0.85rem;
            margin-top: auto;
            border-top: 3px solid var(--ubl-gold);
        }
    </style>
</head>
<body>

    <header>
        <h1>UBL Operations Log Hub</h1>
        <div style="font-size: 0.9rem; font-weight: bold; color: var(--ubl-gold);">Branch Code: Operational MIS</div>
    </header>

    <div class="container">
        <!-- Input Panel: Add New Account Logs -->
        <aside class="card">
            <h3>Log New Account File</h3>
            <form id="accountForm">
                <div class="form-group">
                    <label>Applicant Full Name</label>
                    <input type="text" id="custName" class="form-control" placeholder="e.g. Muhammad Ali" required>
                </div>
                <div class="form-group">
                    <label>Account Category</label>
                    <select id="accType" class="form-control">
                        <option value="Current Regular">Current Regular</option>
                        <option value="UBL Business Partner">UBL Business Partner</option>
                        <option value="Asaan Account">Asaan Account</option>
                        <option value="UBL Ameen Saving">UBL Ameen Saving</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Mandatory Checklist</label>
                    <div class="checkbox-group">
                        <label class="checkbox-item"><input type="checkbox" id="chkBiometric"> Biometric Verification</label>
                        <label class="checkbox-item"><input type="checkbox" id="chkCNIC"> Valid CNIC Attested Copy</label>
                        <label class="checkbox-item"><input type="checkbox" id="chkSource"> Source of Income Proof</label>
                    </div>
                </div>
                <button type="submit" class="btn-submit">Register Entry</button>
            </form>
        </aside>

        <!-- Display Panel: Live Master Database View -->
        <main class="table-responsive">
            <h3 style="color: var(--ubl-blue); margin-bottom: 1rem;">Active Operational File Stream</h3>
            <table id="recordsTable">
                <thead>
                    <tr>
                        <th>Ref ID</th>
                        <th>Customer Name</th>
                        <th>Account Type</th>
                        <th>Compliance Checked</th>
                        <th>Current Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Dynamic asynchronous response streams load inside this container -->
                </tbody>
            </table>
        </main>
    </div>

    <footer>
        UBL Compliance Dashboard Interface - Internal Performance Mockup
    </footer>

    <script>
        const form = document.getElementById('accountForm');
        const tableBody = document.getElementById('tableBody');

        // Fetch logs directly on view component lifecycle startup
        window.onload = function() {
            fetchRecords();
        };

        function fetchRecords() {
            fetch('/api/records')
                .then(response => response.json())
                .then(data => renderTable(data))
                .catch(err => console.error("Error pulling master logs database stream:", err));
        }

        form.addEventListener('submit', function(e) {
            e.preventDefault();

            const payload = {
                name: document.getElementById('custName').value,
                type: document.getElementById('accType').value,
                bio: document.getElementById('chkBiometric').checked,
                cnic: document.getElementById('chkCNIC').checked,
                source: document.getElementById('chkSource').checked
            };

            // Post structured payloads towards active core logic models
            fetch('/api/register-log', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(response => response.json())
            .then(() => {
                fetchRecords(); // Refresh master tracking system dashboard views
                form.reset();
            })
            .catch(err => console.error("Error creating system transaction validation instance:", err));
        });

        function renderTable(records) {
            tableBody.innerHTML = '';
            
            records.forEach((acc) => {
                let checksPassed = 0;
                if(acc.bio) checksPassed++;
                if(acc.cnic) checksPassed++;
                if(acc.source) checksPassed++;

                let badgeClass = 'badge-pending';
                if(acc.status === "Approved") badgeClass = 'badge-approved';
                if(acc.status === "Compliance Hold") badgeClass = 'badge-hold';

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td style="font-weight: bold; color: #555;">${acc.id}</td>
                    <td>${acc.name}</td>
                    <td>${acc.type}</td>
                    <td><progress value="${checksPassed}" max="3" style="width: 80px;"></progress> (${checksPassed}/3)</td>
                    <td><span class="status-badge ${badgeClass}">${acc.status}</span></td>
                    <td>
                        <button class="btn-action" onclick="changeStatus('${acc.id}', 'Approved')">✔️ Clear</button>
                        <button class="btn-action" onclick="changeStatus('${acc.id}', 'Compliance Hold')">⚠️ Hold</button>
                    </td>
                `;
                tableBody.appendChild(tr);
            });
        }

        function changeStatus(refId, newStatus) {
            fetch('/api/update-status', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: refId, status: newStatus })
            })
            .then(response => response.json())
            .then(() => fetchRecords())
            .catch(err => console.error("Could not complete compliance data modification transaction:", err));
        }
    </script>
</body>
</html>
